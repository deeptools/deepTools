[build-system]
requires = [
    "maturin>=1.0,<2.0"
]
build-backend = "maturin"

[tool.maturin]
python-source = "pydeeptools"
exclude = ["pydeeptools/deeptools/test/**/*"]
module-name = "deeptools.hp"
bindings = "pyo3"

[project]
name = "deeptools"
version = "4.0.0"
authors = [
    {name="Fidel Ramirez"},
    {name="Devon P Ryan"},
    {name="Björn Grüning"},
    {name="Friederike Dündar"},
    {name="Sarah Diehl"},
    {name="Vivek Bhardwaj"},
    {name="Fabian Kilpert"},
    {name="Andreas S Richter"},
    {name="Steffen Heyne"},
    {name="Thomas Manke"},
    {email="bioinfo-core@ie-freiburg.mpg.de"}
]
requires-python = ">= 3.12"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.13",
    "matplotlib >= 3.9",
    "pysam >= 0.23",
    "numpydoc >= 1.8",
    "pyBigWig >= 0.3",
    "py2bit >= 0.3",
    "pandas >= 2.2",
    "scikit-learn >= 1.6",
    "deeptoolsintervals >= 0.1",
    "maturin"
]
description = "Useful tools for exploring deep sequencing data."
license = {file = "LICENSE.txt"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
readme = "README.rst"
[project.optional-dependencies]
actions = [
    "flake8",
    "pytest",
    "twine",
    "build",
    "planemo",
    "matplotlib == 3.11", # pin matplotlib version to avoid plots changing in pytests (font size defaults etc.)
]
[project.urls]
homepage = "https://pypi.python.org/pypi/deepTools/"
documentation = "https://deeptools.readthedocs.io/en/latest/"
repository = "https://github.com/deeptools/deepTools"

[tool.setuptools]
packages = ["deeptools"]

[project.scripts]
alignmentSieve = "deeptools.alignmentSieve:main"
#bamCompare_old = "deeptools.bamCompare:main"
#bamCoverage_old = "deeptools.bamCoverage:main"
bamPEFragmentSize = "deeptools.bamPEFragmentSize:main"
bigwigAverage = "deeptools.bigwigAverage:main"
bigwigCompare = "deeptools.bigwigCompare:main"
computeGCBias = "deeptools.computeGCBias:main"
#computeMatrix_old = "deeptools.computeMatrix:main"
computeMatrixOperations = "deeptools.computeMatrixOperations:main"
correctGCBias = "deeptools.correctGCBias:main"
deeptools = "deeptools.deeptools_list_tools:main"
estimateReadFiltering = "deeptools.estimateReadFiltering:main"
estimateScaleFactor = "deeptools.estimateScaleFactor:main"
#multiBamSummary_old = "deeptools.multiBamSummary:main"
multiBigwigSummary = "deeptools.multiBigwigSummary:main"
plotCorrelation = "deeptools.plotCorrelation:main"
plotCoverage = "deeptools.plotCoverage:main"
plotEnrichment = "deeptools.plotEnrichment:main"
plotFingerprint = "deeptools.plotFingerprint:main"
plotHeatmap = "deeptools.plotHeatmap:main"
plotPCA = "deeptools.plotPCA:main"
plotProfile = "deeptools.plotProfile:main"
bamCoverage = "deeptools.bamCoverage2:main"
bamCompare = "deeptools.bamCompare2:main"
computeMatrix = "deeptools.computeMatrix2:main"
#alignmentSieve = "deeptools.alignmentSieve2:main"
multiBamSummary = "deeptools.multiBamSummary2:main"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
[tool.pixi.dependencies]
libclang = "<22"
clangdev = "<22"
htslib = "<=1.19"
zlib = "*"
[tool.pixi.pypi-dependencies]
deeptools = { path = ".", editable = true, extras = ['actions'] }
[tool.pixi.activation.env]
LIBCLANG_PATH = "$CONDA_PREFIX/lib"
