name: tests_pytest
on: [push, pull_request, workflow_dispatch]

permissions:
    contents: read

jobs:
    check_versions_matches:
        name: Check deeptools/galaxy/Rust versions stay in sync
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.x"
            - name: Check version sync
              run: python3 scripts/check_version_sync.py
    build-linux:
        name: Test on Linux
        runs-on: ubuntu-latest
        strategy:
            matrix:
                pixi-env: [py312, py313, py314]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
              with:
                  environments: ${{ matrix.pixi-env }}
            - name: build deeptools
              run: pixi run -e ${{ matrix.pixi-env }} build
            - name: test deeptools
              run: pixi run -e ${{ matrix.pixi-env }} test -v
            - name: build wheel
              run: pixi run -e ${{ matrix.pixi-env }} python -m build
            - name: test wheel
              run: pixi run -e ${{ matrix.pixi-env }} bash -c "pip install dist/*.whl"
    build-osx:
        name: Test on OSX
        runs-on: macOS-latest
        strategy:
            matrix:
                pixi-env: [py312, py313, py314]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
              with:
                  environments: ${{ matrix.pixi-env }}
            - name: build deeptools
              run: pixi run -e ${{ matrix.pixi-env }} build
            - name: test deeptools
              run: pixi run -e ${{ matrix.pixi-env }} test -v
            - name: build wheel
              run: pixi run -e ${{ matrix.pixi-env }} python -m build
            - name: test wheel
              run: pixi run -e ${{ matrix.pixi-env }} bash -c "pip install dist/*.whl"
