name: Wheels
# maturin generate-ci github > .github/workflows/maturin.yml

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
        #   - runner: ubuntu-22.04
        #     target: x86_64
          - runner: ubuntu-22.04 
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: 2_28
          before-script-linux: |
            set -ex
            cat /etc/*release*
            echo "${{ matrix.platform.target }}"
            apt-get update
            apt-get install -y build-essential perl curl libssl-dev pkg-config clang liblzma-dev
            export OPENSSL_LIB_DIR=$(pkg-config --variable=libdir openssl)
            export OPENSSL_INCLUDE_DIR=$(pkg-config --variable=includedir openssl)
            export OPENSSL_DIR="$OPENSSL_LIB_DIR/ssl"
            export OPENSSL_NO_VENDOR=1
            if [ -z "$OPENSSL_LIB_DIR" ] || [ -z "$OPENSSL_INCLUDE_DIR" ]; then
                echo "OpenSSL development files are not installed or pkg-config is not configured correctly."
                exit 1
            fi
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

