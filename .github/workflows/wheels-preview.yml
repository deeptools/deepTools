name: build_wheels_preview

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - master

permissions:
    contents: read

jobs:
    linux:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: ubuntu-22.04
                      target: x86_64
                    - runner: ubuntu-22.04
                      target: aarch64
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
                  manylinux: 2_28
                  before-script-linux: |
                      set -ex
                      cat /etc/*release*
                      if [ "${{ matrix.platform.target }}" = "x86_64" ]; then
                        # maturin-action's manylinux switches to AlmaLinux 8
                        dnf install -y epel-release && dnf update -y
                        dnf install -y gcc gcc-c++ make perl curl clang xz-devel pkgconfig
                        ## we've vendored openssl via Cargo.toml anyway, so this part is no longer used...
                      elif [ "${{ matrix.platform.target }}" = "aarch64" ]; then
                        # cross-compiling on Ubuntu 22.04
                        ## We're vendoring openssl because libssl-dev:aarch64 is not available!
                        apt-get update
                        apt-get install -y build-essential perl curl clang liblzma-dev pkg-config \
                          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross crossbuild-essential-arm64
                      fi
            - name: Upload wheels
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheels-linux-${{ matrix.platform.target }}
                  path: dist

    musllinux:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: ubuntu-22.04
                      target: x86_64
                    - runner: ubuntu-22.04
                      target: aarch64
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
                  manylinux: musllinux_1_2
                  before-script-linux: |
                      apt-get update
                      apt-get install -y musl-tools musl-dev
                      if [ "${{ matrix.platform.target }}" = "aarch64" ]; then
                        apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
                      fi
            - name: Upload wheels
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheels-musllinux-${{ matrix.platform.target }}
                  path: dist

    macos:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: macos-latest
                      target: x86_64
                    - runner: macos-latest
                      target: aarch64
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
            - name: Upload wheels
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheels-macos-${{ matrix.platform.target }}
                  path: dist

    sdist:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build sdist
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  command: sdist
                  args: --out dist
            - name: Upload sdist
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheels-sdist
                  path: dist

    publish-testpypi:
        name: Publish preview to TestPyPI
        runs-on: ubuntu-latest
        if: github.event.pull_request.head.repo.full_name == github.repository
        needs: [linux, musllinux, macos, sdist]
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            - name: Publish to TestPyPI
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              env:
                  MATURIN_PYPI_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
              with:
                  command: upload
                  args: --non-interactive --skip-existing --repository testpypi wheels-*/*
