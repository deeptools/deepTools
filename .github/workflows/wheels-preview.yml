name: build_wheels_preview

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

jobs:
    linux:
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: ubuntu-22.04
                      target: x86_64
                    - runner: ubuntu-22.04
                      target: aarch64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
                  manylinux: 2_28
                  before-script-linux: |
                      set -ex
                      cat /etc/*release*
                      if [ "${{ matrix.platform.target }}" = "x86_64" ]; then
                        # maturin-action's manylinux switches to AlmaLinux 8
                        dnf install -y epel-release && dnf update -y
                        dnf install -y gcc gcc-c++ make perl curl clang xz-devel pkgconfig
                        ## we've vendored openssl via Cargo.toml anyway, so this part is no longer used...
                      elif [ "${{ matrix.platform.target }}" = "aarch64" ]; then
                        # cross-compiling on Ubuntu 22.04
                        ## We're vendoring openssl because libssl-dev:aarch64 is not available!
                        apt-get update
                        apt-get install -y build-essential perl curl clang liblzma-dev pkg-config \
                          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross crossbuild-essential-arm64
                      fi
            - name: Upload wheels
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-linux-${{ matrix.platform.target }}
                  path: dist

    musllinux:
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: ubuntu-22.04
                      target: x86_64
                    - runner: ubuntu-22.04
                      target: aarch64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
                  manylinux: musllinux_1_2
                  before-script-linux: |
                      apt-get update
                      apt-get install -y musl-tools musl-dev
                      if [ "${{ matrix.platform.target }}" = "aarch64" ]; then
                        apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
                      fi
            - name: Upload wheels
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-musllinux-${{ matrix.platform.target }}
                  path: dist

    macos:
        runs-on: ${{ matrix.platform.runner }}
        strategy:
            matrix:
                platform:
                    - runner: macos-latest
                      target: x86_64
                    - runner: macos-latest
                      target: aarch64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.platform.target }}
                  args: --release --out dist --find-interpreter
            - name: Upload wheels
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-macos-${{ matrix.platform.target }}
                  path: dist

    sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: 3.x
            - name: Set preview version
              env:
                  RUN_ID: ${{ github.run_id }}
              run: |
                  python3 <<'PYEOF'
                  import os, re
                  path = "pyproject.toml"
                  text = open(path).read()
                  m = re.search(r'^version = "(.*)"', text, flags=re.M)
                  preview = f'{m.group(1)}.dev{os.environ["RUN_ID"]}'
                  text = text[: m.start()] + f'version = "{preview}"' + text[m.end() :]
                  open(path, "w").write(text)
                  print("preview version:", preview)
                  PYEOF
            - name: Build sdist
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  command: sdist
                  args: --out dist
            - name: Upload sdist
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-sdist
                  path: dist

    publish-testpypi:
        name: Publish preview to TestPyPI
        runs-on: ubuntu-latest
        needs: [linux, musllinux, macos, sdist]
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true
            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
              with:
                  repository-url: https://test.pypi.org/legacy/
                  password: ${{ secrets.TESTPYPI_API_TOKEN }}
                  packages-dir: dist
                  skip-existing: true
