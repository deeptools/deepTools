name: Build Python Wheels

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libclang-dev \
            liblzma-dev \
            cpanminus
          cpanm --notest YAML IPC::Cmd
          awk '/dependencies = \[/,/\]/' pyproject.toml | \
            grep -v "dependencies" | \
            grep -v "\[" | grep -v "\]" | tr -d '", ' | \
            xargs pip install
      - name: Set up local::lib environment
        run: |
          eval $(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib)
          echo 'PATH="$HOME/perl5/bin:$PATH"' >> $GITHUB_ENV
          echo 'PERL5LIB="$HOME/perl5/lib/perl5"' >> $GITHUB_ENV
          echo 'PERL_LOCAL_LIB_ROOT="$HOME/perl5"' >> $GITHUB_ENV
          echo 'PERL_MB_OPT="--install_base $HOME/perl5"' >> $GITHUB_ENV
          echo 'PERL_MM_OPT="INSTALL_BASE=$HOME/perl5"' >> $GITHUB_ENV
      - name: Check Perl version
        run: perl -v
      - name: List installed Perl modules
        run: perl -MCPAN -e 'CPAN::Shell->r'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
