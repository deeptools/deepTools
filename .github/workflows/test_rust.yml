name: tests_rust
on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * 0"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    cargo_test:
        name: run cargo test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - run: rustup update stable && rustup default stable
            - name: cargo build (core only)
              run: cargo build --locked --verbose --no-default-features
              env:
                  RUSTFLAGS: "-D warnings"
            - name: cargo test (core only)
              run: cargo test --locked --verbose --no-default-features
              env:
                  RUSTFLAGS: "-D warnings"
            - name: cargo build (python extension)
              run: cargo build --locked --verbose
            - name: cargo test (python extension)
              run: cargo test --locked --verbose
            - name: core crate has no pyo3 dependency
              run: |
                cargo tree -e normal,build --prefix none --no-default-features > tree.txt
                ! grep -q '^pyo3' tree.txt
