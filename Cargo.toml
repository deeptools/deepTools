[package]
name = "deeptools-core"
version = "4.0.0"
edition = "2024"
rust-version = "1.87"
description = "Pure-Rust core of deepTools: coverage normalization scale factors"
license-file = "LICENSE.txt"
repository = "https://github.com/deeptools/deepTools"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "deeptools_core"
crate-type = ["rlib", "cdylib"]

[features]
python = [
    "dep:pyo3", "pyo3/extension-module",
    "dep:openssl-sys", "dep:bigtools", "dep:rust-htslib", "dep:rayon", "dep:tokio",
    "dep:itertools", "dep:flate2", "dep:tempfile", "dep:ndarray-npy",
]
default = []

[dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"], optional = true }
pyo3 = { version = ">= 0.28.2", optional = true }
bigtools = { version = "0.5.8", default-features = false, features = ["read", "write"], optional = true }
rust-htslib = { version = "1.0.1", optional = true }
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1.53.0", optional = true }
itertools = { version = "0.15.0", optional = true }
flate2 = { version = "1.1.9", optional = true }
tempfile = { version = "3.27.0", optional = true }
ndarray = "0.17.2"
ndarray-npy = { version = "0.10.0", optional = true }
thiserror = "2.0"
