[package]
name = "deeptools-core"
version = "4.0.0"
edition = "2024"
rust-version = "1.87"
description = "Pure-Rust core of deepTools: coverage normalization scale factors"
license-file = "LICENSE.txt"
repository = "https://github.com/deeptools/deepTools"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "deeptools_core"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]
default = []

[dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }
pyo3 = { version = ">= 0.28.2", optional = true }
bigtools = { version = "0.5.8", default-features = false, features = ["read", "write"] }
rust-htslib = "1.0.1"
rayon = "1.12.0"
tokio = "1.53.0"
itertools = "0.15.0"
flate2 = "1.1.9"
tempfile = "3.27.0"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
thiserror = "2.0"
