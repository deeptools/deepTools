[package]
name = "hp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "hp"
crate-type = ["cdylib"]

[dependencies]
openssl-sys = { version = "*", features = ["vendored"] }
pyo3 = { version = "*", features = ["extension-module"] }
rust-htslib = "*"
rayon = "*"
tokio = "*"
itertools = "*"
bigtools = "*"
flate2 = "*"
tempfile = "*"
ndarray = "*"
ndarray-npy = "*"
